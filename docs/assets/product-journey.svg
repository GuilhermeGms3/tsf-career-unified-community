<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">Jornada do Career Unified Experience V2</title>
  <desc id="desc">Cinco fases da descoberta ao acompanhamento e os engines que sustentam cada fase.</desc>
  <defs><style>.bg{fill:#f5f4ef}.card{fill:#fff;stroke:#d9dfdc;stroke-width:2}.title{font:700 18px system-ui;fill:#182326}.phase{font:800 13px system-ui;fill:#16766c;letter-spacing:1px}.copy{font:13px system-ui;fill:#5b696c}.line{stroke:#16766c;stroke-width:3;fill:none}.support{fill:#0d2026}.supportText{font:700 14px system-ui;fill:#fff}.small{font:12px system-ui;fill:#b9ceca}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16766c"/></marker></defs>
  <rect class="bg" width="1400" height="430" rx="18"/>
  <path class="line" marker-end="url(#arrow)" d="M260 180h45M525 180h45M790 180h45M1055 180h45"/>
  <g transform="translate(30 95)"><rect class="card" width="230" height="170" rx="14"/><text class="phase" x="20" y="34">DESCOBRIR</text><text class="title" x="20" y="66">Discovery Engine V3</text><text class="copy" x="20" y="96">Search Intent</text><text class="copy" x="20" y="119">Mass Hunt</text><text class="copy" x="20" y="142">Company Radar</text></g>
  <g transform="translate(305 95)"><rect class="card" width="220" height="170" rx="14"/><text class="phase" x="20" y="34">AVALIAR</text><text class="title" x="20" y="66">ATS Matcher V2</text><text class="copy" x="20" y="96">Eligibility</text><text class="copy" x="20" y="119">Evidence</text><text class="copy" x="20" y="142">Opportunity Priority</text></g>
  <g transform="translate(570 95)"><rect class="card" width="220" height="170" rx="14"/><text class="phase" x="20" y="34">PREPARAR</text><text class="title" x="20" y="66">Resume Engines</text><text class="copy" x="20" y="96">ResumeSelector</text><text class="copy" x="20" y="119">ResumeTailor + Guard</text><text class="copy" x="20" y="142">Tectonic</text></g>
  <g transform="translate(835 95)"><rect class="card" width="220" height="170" rx="14"/><text class="phase" x="20" y="34">CANDIDATAR</text><text class="title" x="20" y="66">Application Planner</text><text class="copy" x="20" y="96">Preflight</text><text class="copy" x="20" y="119">Fill Only</text><text class="copy" x="20" y="142">Human Review</text></g>
  <g transform="translate(1100 95)"><rect class="card" width="270" height="170" rx="14"/><text class="phase" x="20" y="34">ACOMPANHAR</text><text class="title" x="20" y="66">Application Tracking</text><text class="copy" x="20" y="96">Events + Attempts</text><text class="copy" x="20" y="119">Interviews</text><text class="copy" x="20" y="142">Follow-ups</text></g>
  <g transform="translate(305 310)"><rect class="support" width="765" height="80" rx="14"/><text class="supportText" x="25" y="33">Candidate Knowledge + Next Action Engine</text><text class="small" x="25" y="57">Evidências reais, reutilização controlada e próxima ação determinística em toda a jornada</text></g>
</svg>
