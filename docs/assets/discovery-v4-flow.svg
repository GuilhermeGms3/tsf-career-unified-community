<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo do Discovery V4</title><desc id="desc">Search Composer consulta ATS e Public Web; WhatsApp opt-in e captura manual geram leads; revisão humana promove para o pipeline canônico.</desc>
  <defs><style>.b{fill:#fff;stroke:#23324a;stroke-width:2;rx:14}.t{font:600 16px system-ui;fill:#172033}.s{font:13px system-ui;fill:#536078}.a{stroke:#526b91;stroke-width:2;fill:none;marker-end:url(#m)}.h{fill:#eef4ff;stroke:#315da8}.c{fill:#edf9f1;stroke:#377a4f}.w{fill:#fff7e8;stroke:#9a641d}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526b91"/></marker></defs>
  <rect x="30" y="40" width="210" height="74" class="b h"/><text x="135" y="72" text-anchor="middle" class="t">Search Composer</text><text x="135" y="94" text-anchor="middle" class="s">intent + query budget</text>
  <rect x="320" y="20" width="210" height="74" class="b"/><text x="425" y="52" text-anchor="middle" class="t">ATS / Job Boards</text><text x="425" y="74" text-anchor="middle" class="s">dados estruturados</text>
  <rect x="320" y="120" width="210" height="74" class="b"/><text x="425" y="152" text-anchor="middle" class="t">Public Web API</text><text x="425" y="174" text-anchor="middle" class="s">Brave ou CONFIG_REQUIRED</text>
  <rect x="30" y="250" width="210" height="74" class="b w"/><text x="135" y="282" text-anchor="middle" class="t">WhatsApp opt-in</text><text x="135" y="304" text-anchor="middle" class="s">allowlist + detector barato</text>
  <rect x="30" y="360" width="210" height="74" class="b w"/><text x="135" y="392" text-anchor="middle" class="t">Captura manual</text><text x="135" y="414" text-anchor="middle" class="s">URL ou texto público</text>
  <rect x="620" y="130" width="220" height="88" class="b w"/><text x="730" y="164" text-anchor="middle" class="t">Lead / HiringSignal</text><text x="730" y="187" text-anchor="middle" class="s">mínimo + trust + risco</text>
  <rect x="620" y="300" width="220" height="88" class="b h"/><text x="730" y="334" text-anchor="middle" class="t">Revisão humana</text><text x="730" y="357" text-anchor="middle" class="s">fatos suficientes?</text>
  <rect x="930" y="155" width="220" height="88" class="b c"/><text x="1040" y="189" text-anchor="middle" class="t">Job canônico</text><text x="1040" y="212" text-anchor="middle" class="s">dedup + autoridade</text>
  <rect x="930" y="315" width="220" height="88" class="b c"/><text x="1040" y="349" text-anchor="middle" class="t">Matcher e prioridade</text><text x="1040" y="372" text-anchor="middle" class="s">Candidate Knowledge</text>
  <path d="M240 67 L320 57" class="a"/><path d="M240 90 L320 157" class="a"/><path d="M530 57 L930 181" class="a"/><path d="M530 157 L620 166" class="a"/><path d="M240 287 L620 174" class="a"/><path d="M240 397 L620 195" class="a"/><path d="M730 218 L730 300" class="a"/><path d="M840 344 L930 225" class="a"/><path d="M1040 243 L1040 315" class="a"/>
</svg>
