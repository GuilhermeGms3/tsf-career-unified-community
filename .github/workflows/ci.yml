name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check:syntax

      - name: Check public release boundaries
        run: node scripts/check-public-release.mjs

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Run Node test suite
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r engine/requirements.txt

      - name: Run Python tests
        run: python -m unittest discover -s engine -p "test_*.py"

      - name: Validate Docker Compose
        run: docker compose config --quiet
